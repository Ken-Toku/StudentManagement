<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>受講生詳細</title>
</head>
<body>
<h1>受講生詳細</h1>
<form th:action="@{/updateStudent}" th:object="${studentDetail}" method="post">
  <div>
    <input type="hidden" th:field="*{student.id}">
  </div>

  <div>
    <label for="name">名前:</label>
    <input type="text" id="name" th:field="*{student.name}" required/>
  </div>

  <div>
    <label for="furigana">振り仮名:</label>
    <input type="text" id="furigana" th:field="*{student.furigana}" required/>
  </div>

  <div>
    <label for="age">年齢:</label>
    <input type="text" id="age" th:field="*{student.age}"/>
  </div>

  <div>
    <label for="gender">性別:</label>
    <input type="text" id="gender" th:field="*{student.gender}" required/>
  </div>

  <div>
    <label for="nickname">ニックネーム:</label>
    <input type="text" id="nickname" th:field="*{student.nickname}" required/>
  </div>

  <div>
    <label for="email">メールアドレス:</label>
    <input type="text" id="email" th:field="*{student.email}" required>
  </div>

  <div>
    <label for="city">地域:</label>
    <input type="text" id="city" th:field="*{student.city}" required/>
  </div>

  <div>
    <label for="remark">備考:</label>
    <input type="text" id="remark" th:field="*{student.remark}"/>
  </div>

  <div>
    <label for="isDeleted">キャンセル：</label>
    <input type="checkbox" id="isDeleted" th:field="*{student.deleted}"/>
  </div>

  <div th:each="course, stat : *{studentCourses}">
    <label th:for="studentCourses.[__${stat.index}__].id">受講コースID:</label>
    <input type="text" th:field="*{studentCourses[__${stat.index}__].id}" readonly/>

    <label th:for="*{studentCourses[__${stat.index}__].courseName}">受講コース名:</label>
    <input type="text" th:field="*{studentCourses[__${stat.index}__].courseName}"/>
  </div>

  <div>
    <button type="submit">更新</button>
  </div>
</form>
</body>
</html>

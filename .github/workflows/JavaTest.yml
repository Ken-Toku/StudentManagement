name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  EC2_USER: 'ec2-user'
  # --EC2_HOST EC2インスタンスを立ち上げるたびに再設定する必要性有
  EC2_HOST: '52.193.195.193'
  SRC_PATH: 'build/libs/*.jar'
  DEST_PATH: '/home/ec2-user/StudentManagement/app/StudentManagement.jar'


jobs:
  deploy:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Test with Gradle Wrapper
        # --stacktrace などを追加して、エラーの詳細が出るようにする
        run: ./gradlew test --stacktrace --warning-mode=all --info

      - name: Build with Gradle Wrapper
        run: ./gradlew bootJar

      # -- デプロイ（mainにマージされたときのみ）
      - name: SCP Copy Application to EC2
        if: github.event_name == 'push'
        env:
          PRIVATE_KEY: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
        run: |
          printf '%s' "$PRIVATE_KEY" > private_key && chmod 600 private_key
          scp -o StrictHostKeyChecking=no -i private_key $SRC_PATH $EC2_USER@$EC2_HOST:$DEST_PATH

      - name: SSH Application Deploy
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: |
            sudo yum update -y
            
            if [ -f /etc/systemd/system/StudentManagement.service ]; then
              echo "already exists Service File"
            else
              sudo tee /etc/systemd/system/StudentManagement.service > /dev/null <<'EOL'
            [Unit]
            Description=StudentManagement App
            After=network.target
            
            [Service]
            Type=simple
            User=ec2-user
            Group=ec2-user
            WorkingDirectory=/home/ec2-user
            
            ExecStart=/usr/bin/java -jar /home/ec2-user/StudentManagement/app/StudentManagement.jar \
              --spring.config.additional-location=file:/home/ec2-user/StudentManagement/config/ \
              --spring.config.name=application-aws
            
            Restart=on-failure
            RestartSec=3
            SuccessExitStatus=143
            
            [Install]
            WantedBy=multi-user.target
            EOL
            fi
            
            sudo systemctl daemon-reload
            
            if sudo systemctl is-active --quiet StudentManagement; then
              sudo systemctl restart StudentManagement
            else
              sudo systemctl start StudentManagement
            fi

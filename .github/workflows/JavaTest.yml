name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  EC2_USER: 'ec2-user'
  EC2_HOST: ${{ vars.EC2_HOST }}
  DEST_PATH: '/home/ec2-user/StudentManagement/app/StudentManagement.jar'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Test with Gradle Wrapper
        run: ./gradlew test --stacktrace --warning-mode=all --info

      - name: Build with Gradle Wrapper
        run: ./gradlew bootJar

      # --- CD（mainマージ時のみ）---
      - name: Prepare known_hosts
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SCP Copy Application to EC2
        if: github.event_name == 'push'
        env:
          PRIVATE_KEY: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
        run: |
          JAR_PATH="$(ls -1 build/libs/*.jar | head -n 1)"
          echo "Deploy jar: $JAR_PATH"

          printf '%s' "$PRIVATE_KEY" > private_key
          chmod 600 private_key

          scp -i private_key "$JAR_PATH" "$EC2_USER@$EC2_HOST:$DEST_PATH"

          rm -f private_key

      - name: SSH Application Deploy
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: |
            if [ ! -f /etc/systemd/system/StudentManagement.service ]; then
              echo "StudentManagement.service not found. Run first-time setup."
              exit 1
            fi

            sudo systemctl daemon-reload
            sudo systemctl enable StudentManagement

            sudo yum update -y

            if sudo systemctl is-active --quiet StudentManagement; then
              sudo systemctl restart StudentManagement
            else
              sudo systemctl start StudentManagement
            fi
